[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-window"
version = "1.0.0"
description = "GPT Vision Desktop Application with screenshot analysis and video processing tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PyQt5>=5.15.0",
    "mss>=6.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.21.0",
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "moviepy>=1.0.3",
    "opencv-python>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.0.0",
]
secure = [
    "keyring>=24.0.0",
]

[project.scripts]
gpt-window = "gpt_window.__main__:main"
gpt-video-compile = "gpt_window.video_tools.compiler:main"
gpt-video-loop = "gpt_window.video_tools.looper:main"
gpt-video-process = "gpt_window.video_tools.processor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpt_window*"]
exclude = ["tests*"]

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=gpt_window --cov-report=html --cov-report=term"
qt_api = "pyqt5"

[tool.coverage.run]
source = ["gpt_window"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
